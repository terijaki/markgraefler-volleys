name: SST Destroy on Branch Close

on:
  pull_request:
    types: [closed]
  delete:

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Destroy Feature Branch Stage
    if: >-
      (github.event_name == 'delete' && github.event.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::926634327887:role/GitHubActionsCDKRole
          aws-region: eu-central-1

      - name: Load environment variables
        uses: dmno-dev/varlock-action@v1.0.5

      - name: Determine branch name
        id: branch
        run: |
          BRANCH="${{ github.event_name == 'delete' && github.event.ref || github.event.pull_request.head.ref }}"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Resolve SST stage
        id: stage
        env:
          CDK_BRANCH_OVERWRITE: ${{ steps.branch.outputs.branch }}
        run: |
          SST_STAGE=$(vp exec tsx -e '
            import { resolveSstStage } from "./utils/sst-stage.ts";
            process.stdout.write(resolveSstStage());
          ')
          echo "sst_stage=$SST_STAGE" >> "$GITHUB_OUTPUT"

      - name: Cancel running deploy workflows
        uses: actions/github-script@v9
        with:
          script: |
            const branch = '${{ steps.branch.outputs.branch }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            for (const status of ['in_progress', 'queued']) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'sst-deploy.yml',
                status,
                per_page: 100,
              });

              for (const run of runs.data.workflow_runs) {
                if (run.head_branch === branch) {
                  await github.rest.actions.cancelWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                  });
                }
              }
            }

      - name: SST Remove
        env:
          SST_STAGE: ${{ steps.stage.outputs.sst_stage }}
          CDK_BRANCH_OVERWRITE: ${{ steps.branch.outputs.branch }}
        run: |
          echo "Removing SST stage: $SST_STAGE"
          npx sst remove --stage "$SST_STAGE"

      - name: Add destroy summary
        run: |
          echo "## 🗑️ SST Stage Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage** | \`${{ steps.stage.outputs.sst_stage }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ steps.branch.outputs.branch }}\` |" >> $GITHUB_STEP_SUMMARY
