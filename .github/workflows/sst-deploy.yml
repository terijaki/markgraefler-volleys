name: SST Deploy

concurrency:
  group: sst-deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths-ignore:
      - "**.md"
      - ".github/copilot**"
      - ".vscode/**"

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    name: Deploy SST Stage
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      webapp_url: ${{ steps.resolve-webapp-url.outputs.webapp_url }}
    env:
      CDK_ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      SENTRY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Install SST platform
        run: vp run sst:install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && 'arn:aws:iam::883425316554:role/GitHubActionsCDKRole' || 'arn:aws:iam::926634327887:role/GitHubActionsCDKRole' }}
          aws-region: eu-central-1

      - name: Ensure SST bootstrap IAM permissions
        run: |
          ACCOUNT="${{ github.ref == 'refs/heads/main' && '883425316554' || '926634327887' }}"
          POLICY=$(sed \
            -e "s/ACCOUNT/${ACCOUNT}/g" \
            -e "s/REGION/eu-central-1/g" \
            docs/github-actions-sst-bootstrap-policy.json)
          aws iam put-role-policy \
            --role-name GitHubActionsCDKRole \
            --policy-name SSTBootstrap \
            --policy-document "$POLICY"

      - name: Load environment variables
        uses: dmno-dev/varlock-action@v1.0.5

      - name: Resolve SST stage
        id: stage
        env:
          CDK_BRANCH_OVERWRITE: ${{ github.ref_name }}
        run: |
          SST_STAGE=$(vp exec tsx -e '
            import { resolveSstStage } from "./utils/sst-stage.ts";
            process.stdout.write(resolveSstStage());
          ')
          echo "sst_stage=$SST_STAGE" >> "$GITHUB_OUTPUT"
          echo "Using SST stage: $SST_STAGE"

      - name: Lint check
        run: vp lint

      - name: Run tests
        run: vp test

      - name: SST Diff
        env:
          SST_STAGE: ${{ steps.stage.outputs.sst_stage }}
          CDK_BRANCH_OVERWRITE: ${{ github.ref_name }}
        run: |
          set +e
          vp run sst:diff -- --stage "$SST_STAGE" --print-logs 2>&1 | tee /tmp/sst-diff.log
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -qi "stage not found" /tmp/sst-diff.log; then
              echo "Stage '$SST_STAGE' does not exist yet — skipping diff before first deploy."
              exit 0
            fi
            exit "$status"
          fi

      - name: SST Deploy
        env:
          SST_STAGE: ${{ steps.stage.outputs.sst_stage }}
          CDK_BRANCH_OVERWRITE: ${{ github.ref_name }}
        run: vp run sst:deploy -- --stage "$SST_STAGE" --print-logs

      - name: Resolve deployed web app URL
        id: resolve-webapp-url
        run: |
          WEBAPP_URL=$(jq -r '.webappUrl' .sst/outputs.json)
          echo "webapp_url=$WEBAPP_URL" >> "$GITHUB_OUTPUT"
          echo "Using deployed URL: $WEBAPP_URL"

      - name: Add deployment summary
        run: |
          echo "## ${{ github.ref == 'refs/heads/main' && '🚀' || '🔧' }} SST Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage** | \`${{ steps.stage.outputs.sst_stage }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ env.CDK_ENVIRONMENT }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Webapp URL** | \`${{ steps.resolve-webapp-url.outputs.webapp_url }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This stage will be removed automatically when the branch is deleted or the PR is closed." >> $GITHUB_STEP_SUMMARY
          fi

  synth:
    name: SST Diff (Dependabot)
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      CDK_ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      SENTRY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Install SST platform
        run: vp run sst:install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && 'arn:aws:iam::883425316554:role/GitHubActionsCDKRole' || 'arn:aws:iam::926634327887:role/GitHubActionsCDKRole' }}
          aws-region: eu-central-1

      - name: Load environment variables
        uses: dmno-dev/varlock-action@v1.0.5

      - name: Lint check
        run: vp lint

      - name: Run tests
        run: vp test

      - name: SST Diff
        env:
          SST_STAGE: production
        run: vp run sst:diff -- --stage production --print-logs || true

  e2e-tests:
    name: E2E Tests
    needs: deploy
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Install Playwright browser
        run: vp exec playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        id: playwright
        timeout-minutes: 15
        env:
          WEBAPP_URL: ${{ needs.deploy.outputs.webapp_url }}
        run: vp run test:e2e

      - name: Add E2E summary
        if: always()
        run: |
          ICON="✅"
          RESULT="Passed"
          if [ "${{ steps.playwright.outcome }}" != "success" ]; then
            ICON="❌"
            RESULT="Failed"
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ${ICON} Playwright E2E Smoke" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Base URL** | \`${{ needs.deploy.outputs.webapp_url }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Result** | ${RESULT} |" >> $GITHUB_STEP_SUMMARY
