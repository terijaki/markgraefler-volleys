version: 2
updates:
  # Single Bun entry — grouped PRs, no duplicate monthly/weekly configs.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Align with bunfig.toml minimumReleaseAge (2 days); security updates bypass cooldown.
    cooldown:
      default-days: 2
      semver-patch-days: 2
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      aws:
        patterns:
          - "@aws-sdk/*"
          - "@aws-lambda-powertools/*"
          - "@smithy/*"
          - "aws-xray-sdk-core"
          - "aws-cdk*"
          - "aws-sdk-client-mock"
          - "constructs"
      mantine:
        patterns:
          - "*mantine*"
          - "*postcss*"
      tanstack:
        patterns:
          - "*tanstack*"
      tiptap:
        patterns:
          - "*tiptap*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "babel-plugin-react-compiler"
          - "lucide-react"
          - "react-world-flags"
      sentry:
        patterns:
          - "@sentry/*"
      validation:
        patterns:
          - "zod"
          - "typescript"
          - "@types/*"
      dates-and-times:
        patterns:
          - "dayjs"
          - "num-words-de"
          - "ts-ics"
      vite:
        patterns:
          - "vite"
          - "*vite*"
          - "vite-plus"
          - "esbuild"
          - "tsx"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
